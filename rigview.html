<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Rig Viewer — 캐릭터 룩 검증</title>
<style>
  html,body { margin:0; height:100%; background:#14161c; overflow:hidden; }
  canvas { display:block; }
  #ui { position:fixed; left:10px; top:10px; z-index:2; font:12px ui-monospace,monospace; color:#ddd; }
  #ui button { font:inherit; padding:3px 8px; margin-right:4px; background:#222736; color:#ddd; border:1px solid #3a4152; cursor:pointer; }
  #poses { position:fixed; left:10px; bottom:12px; z-index:2; color:#ddd; font:13px sans-serif; }
  #poses button { padding:7px 12px; margin:3px; border:1px solid #596273; color:#eee; background:#252b36; cursor:pointer; }
  #ui button.on { background:#c8241f; border-color:#e0574f; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui"></div>
<div id="poses">자세 확인 </div>
<script type="module">
import * as THREE from 'three';
import { applyPunchToPose } from './js/Punch.js';
import { COACH_DEFS, CHARACTERS, buildBoxer, defaultPose, applyPose, FIGHTER_SCALE } from './js/Rig.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, stencil: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161c);

// 인게임 링 조명 근사: 위에서 때리는 스포트 + 약한 필 2개
const spot = new THREE.SpotLight(0xfff3e2, 240, 0, Math.PI * 0.32, 0.45, 2);
spot.position.set(0.8, 6.0, 2.2);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
scene.add(spot, spot.target);
const fill1 = new THREE.DirectionalLight(0xbcd0ff, 0.6); fill1.position.set(-3, 2, -2.5); scene.add(fill1);
const fill2 = new THREE.DirectionalLight(0xffd9b0, 0.85); fill2.position.set(2.5, 1.6, 3); scene.add(fill2);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0xdedbd4, roughness: .95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);

const KEYS = Object.keys(CHARACTERS);
const rigs = KEYS.map((k, i) => {
  const rig = buildBoxer(CHARACTERS[k]);
  rig.root.position.x = (i - (KEYS.length - 1) / 2) * 1.15;
  rig.root.rotation.y = 0.28;
  scene.add(rig.root);
  const p = defaultPose();
  p.guard = 1;                       // 가드 자세 = 레퍼런스 포즈에 가장 가까움
  applyPose(rig, p);
  return rig;
});

// 뷰 프리셋 — 실제 본 월드 좌표에서 계산한다 (하드코딩하면 체형 파라미터가 바뀔 때 어긋난다)
const V3 = THREE.Vector3;
const worldOf = (obj) => obj.getWorldPosition(new V3());
const VIEWS = [{ label: '전체 10인', build: () => ({ target: new V3(0, 0.95, 0), dist: 12.8, fov: 30, up: 0.4 }) }];
for (const [i, key] of KEYS.entries()) {
  const up = key.toUpperCase();
  VIEWS.push({ label: up + ' 전신', build: () => ({ target: worldOf(rigs[i].hips), dist: 4.4, fov: 30, up: 0.16 }) });
  VIEWS.push({ label: up + ' 상반신', build: () => ({ target: worldOf(rigs[i].chest), dist: 1.6, fov: 30, up: 0.12 }) });
  VIEWS.push({ label: up + ' 얼굴', build: () => ({ target: worldOf(rigs[i].headMesh), dist: 0.78, fov: 26, up: 0.02 }) });
}
let view = VIEWS[0];
function applyView() {
  const v = view.build();
  const t = v.target.clone();
  camera.position.set(t.x + 0.16 * v.dist, t.y + v.up, t.z + v.dist);
  camera.lookAt(t);
  camera.fov = v.fov;
  camera.updateProjectionMatrix();
  spot.target.position.set(t.x, 0.9, 0);
  spot.target.updateMatrixWorld();
}
const ui = document.getElementById('ui');
for (const v of VIEWS) {
  const b = document.createElement('button');
  b.textContent = v.label;
  b.onclick = () => { view = v; applyView(); paint(); [...ui.children].forEach(c => c.classList.toggle('on', c === b)); };
  ui.appendChild(b);
}
ui.firstChild.classList.add('on');
applyView();

function paint() { renderer.render(scene, camera); }
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); paint();
});
paint();
const poseLabels = ['정면', '측면', '가드', '스트레이트', '훅'];
function setPose(label) {
  for(const rig of rigs) {
    const p=defaultPose();
    if(label==='정면'||label==='측면') {
      for(const key of ['hipsRotY','waistX','waistY','headX','headY','shLX','shLY','shLZ','shRX','shRY','shRZ','elL','elR'])p[key]=0;
    }
    if(label==='스트레이트'||label==='훅') applyPunchToPose(p,{side:'L',type:label==='훅'?'hook':'straight',t:.5,dur:1});
    applyPose(rig,p);rig.root.rotation.y=label==='측면'?Math.PI/2:0;
  }
  applyView();paint();
}
for(const label of poseLabels) {
  const button=document.createElement('button');button.textContent=label;button.onclick=()=>setPose(label);document.getElementById('poses').appendChild(button);
}
window.__rigview = { scene, camera, renderer, rigs, paint, setPose,
  setView: label => { view = VIEWS.find(v => v.label === label) || VIEWS[0]; applyView(); paint(); },
  views: VIEWS.map(v => v.label) };
window.__ready = true;
</script>
</body>
</html>
